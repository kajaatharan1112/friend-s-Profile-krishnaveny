<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Indian Wedding Background</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #6B0011;
      --bg-dark:    #3D0008;
      --gold-bright:#FFD700;
      --gold-main:  #D4AF37;
      --gold-dark:  #8B6914;
      --accent-red: #8B0000;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    .hero-bg {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: radial-gradient(
        ellipse 100% 90% at 50% 42%,
        #8B1020 0%, #7B0D1E 18%, #6B0011 36%,
        #520010 56%, #3D0008 76%, #260005 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .layer-texture {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0.17;
      pointer-events: none;
      z-index: 0;
    }

    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(
        ellipse at center,
        transparent 18%,
        rgba(22,0,5,0.30) 48%,
        rgba(10,0,2,0.78) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* ── Entrance animations ── */
    @keyframes heroFadeIn   { from{opacity:0} to{opacity:1} }
    @keyframes mandalaReveal {
      from { opacity:0; transform:translate(-50%,-50%) scale(0.88); }
      to   { opacity:1; transform:translate(-50%,-50%) scale(1); }
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
    @keyframes rinSpin { to { transform: rotate(360deg); } }
    @keyframes cPulse  {
      0%,100% { filter: brightness(1)    drop-shadow(0 0 6px rgba(255,215,0,.5)); }
      50%     { filter: brightness(1.25) drop-shadow(0 0 18px rgba(255,215,0,.9)); }
    }
    @keyframes particleFade {
      0%   { opacity:0; transform:translateY(0)   scale(.6); }
      25%  { opacity:.9; }
      75%  { opacity:.5; }
      100% { opacity:0; transform:translateY(-100px) scale(1.2); }
    }

    /* ── Mandala ── */
    .mandala-wrap {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(700px, 92vw);
      height: min(700px, 92vw);
      z-index: 2;
      filter:
        drop-shadow(0 0 40px rgba(212,175,55,.44))
        drop-shadow(0 0 12px rgba(255,215,0,.28));
      animation: mandalaReveal 2.4s cubic-bezier(.22,1,.36,1) forwards;
    }
    .mandala-wrap svg { width:100%; height:100%; }

    .ring-spin     { transform-box:fill-box; transform-origin:center; animation:rinSpin 220s linear infinite; }
    .ring-spin-rev { transform-box:fill-box; transform-origin:center; animation:rinSpin 180s linear infinite reverse; }
    .shimmer-a     { transform-box:fill-box; transform-origin:center; animation:rinSpin 38s  linear infinite; }
    .shimmer-b     { transform-box:fill-box; transform-origin:center; animation:rinSpin 55s  linear infinite reverse; }
    .center-pulse  { transform-box:fill-box; transform-origin:center; animation:cPulse 5s ease-in-out infinite; }

    /* ── Border strips ── */
    .border-strip { position:absolute; top:0; bottom:0; width:60px; z-index:3; overflow:hidden; }
    .border-strip svg { width:100%; height:100%; }
    .border-strip.right { right:0; }
    .border-strip.left  { left:0; transform:scaleX(-1); }

    /* ── Corner ornaments ── */
    .corner-orn { position:absolute; width:150px; height:150px; z-index:4; }
    .corner-orn svg { width:100%; height:100%; }
    .corner-orn.tl { top:0; left:0; }
    .corner-orn.tr { top:0; right:0; transform:scaleX(-1); }
    .corner-orn.bl { bottom:0; left:0; transform:scaleY(-1); }
    .corner-orn.br { bottom:0; right:0; transform:scale(-1,-1); }

    /* ── Horizontal dividers ── */
    .h-divider {
      position:absolute; left:60px; right:60px;
      height:22px; z-index:3;
    }
    .h-divider svg { width:100%; height:100%; display:block; }
    .h-divider.top    { top:100px; }
    .h-divider.bottom { bottom:100px; }
    /* CSS center-diamond — avoids invalid SVG calc() */
    .h-divider::before {
      content: '◆';
      position:absolute; left:50%; top:50%;
      transform:translate(-50%,-50%);
      color:#D4AF37;
      font-size:13px;
      text-shadow:0 0 10px rgba(212,175,55,.7);
      pointer-events:none; z-index:1;
    }

    /* ── Particles ── */
    .particles { position:absolute; inset:0; z-index:1; pointer-events:none; }
    .particle {
      position:absolute;
      border-radius:50%;
      background:#FFD700;
      opacity:0;
      animation: particleFade var(--d,8s) var(--dl,0s) ease-in-out infinite;
    }

    /* ── Content ── */
    .content {
      position:relative; z-index:5;
      text-align:center;
      padding:80px 160px;
      max-width:880px;
      animation: slideUp 2s 1.2s cubic-bezier(.22,1,.36,1) both;
    }
    .content-title {
      font-family: 'Cinzel Decorative', Georgia, serif;
      font-size: clamp(1.5rem, 3.8vw, 3rem);
      font-weight: 400;
      color: #FFD700;
      text-shadow:
        0 0 32px rgba(255,215,0,.65),
        0 0 64px rgba(212,175,55,.30),
        0 2px 5px rgba(0,0,0,.55);
      letter-spacing: .08em;
      line-height: 1.4;
    }
    .content-sub {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: clamp(.95rem, 2.1vw, 1.35rem);
      font-weight: 300;
      color: #C5A028;
      letter-spacing: .22em;
      margin-top: 14px;
      opacity: .90;
    }
    .content-divider {
      width: 220px;
      height: 1.5px;
      background: linear-gradient(to right, transparent, #D4AF37, transparent);
      margin: 20px auto;
    }
  </style>
</head>
<body>
<div class="hero-bg">

  <!-- ══ TEXTURE ══ -->
  <svg class="layer-texture" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="texPat" x="0" y="0" width="110" height="110" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#C8001A" transform="translate(55,55)">
          <circle r="50" stroke-width=".35"/><circle r="36" stroke-width=".50"/>
          <circle r="22" stroke-width=".38"/><circle r="9"  stroke-width=".40"/>
          <ellipse rx="9" ry="48" stroke-width=".45"/>
          <ellipse rx="9" ry="48" transform="rotate(90)" stroke-width=".45"/>
          <ellipse rx="8" ry="34" transform="rotate(45)"  stroke-width=".35"/>
          <ellipse rx="8" ry="34" transform="rotate(135)" stroke-width=".35"/>
          <circle cx="0"   cy="-36" r="3.5" stroke-width=".40"/>
          <circle cx="36"  cy="0"   r="3.5" stroke-width=".40"/>
          <circle cx="0"   cy="36"  r="3.5" stroke-width=".40"/>
          <circle cx="-36" cy="0"   r="3.5" stroke-width=".40"/>
          <circle cx="24"  cy="-24" r="2.5" stroke-width=".35"/>
          <circle cx="24"  cy="24"  r="2.5" stroke-width=".35"/>
          <circle cx="-24" cy="24"  r="2.5" stroke-width=".35"/>
          <circle cx="-24" cy="-24" r="2.5" stroke-width=".35"/>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#texPat)"/>
  </svg>

  <div class="vignette"></div>
  <div class="particles" id="particles"></div>

  <!-- ══ MANDALA ══ -->
  <div class="mandala-wrap">
    <svg viewBox="-320 -320 640 640" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gPetal" cx="50%" cy="28%" r="72%" fx="50%" fy="15%">
          <stop offset="0%"   stop-color="#FFD700"/>
          <stop offset="38%"  stop-color="#D4AF37"/>
          <stop offset="72%"  stop-color="#C5A028"/>
          <stop offset="100%" stop-color="#8B6914"/>
        </radialGradient>
        <radialGradient id="gCenter" cx="40%" cy="35%" r="65%">
          <stop offset="0%"   stop-color="#FFE44D"/>
          <stop offset="45%"  stop-color="#D4AF37"/>
          <stop offset="85%"  stop-color="#C5A028"/>
          <stop offset="100%" stop-color="#9A7820"/>
        </radialGradient>
        <linearGradient id="gLine" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#FFD700"/>
          <stop offset="48%"  stop-color="#D4AF37"/>
          <stop offset="100%" stop-color="#8B6914"/>
        </linearGradient>

        <!-- Reusable petal / leaf shapes -->
        <path id="ps"   d="M0,-30 C14,-36 14,-49 0,-55 C-14,-49 -14,-36 0,-30 Z"/>
        <path id="pl"   d="M0,-30 L9,-43 0,-51 L-9,-43 Z"/>
        <path id="pL"   d="M0,-82 C27,-95 28,-114 0,-126 C-28,-114 -27,-95 0,-82 Z"/>
        <path id="pLL"  d="M0,-82 L15,-101 0,-114 L-15,-101 Z"/>
        <path id="pp"   d="M0,-90 C6,-100 5,-113 0,-117 C-5,-113 -6,-100 0,-90 Z"/>
        <path id="pM"   d="M0,-156 C20,-170 21,-186 0,-198 C-21,-186 -20,-170 0,-156 Z"/>
        <path id="pML"  d="M0,-156 L12,-173 0,-185 L-12,-173 Z"/>
        <path id="pSB"  d="M0,-234 L14,-267 0,-295 L-14,-267 Z"/>
        <path id="pSBS" d="M0,-236 L7,-257 0,-275 L-7,-257 Z"/>
        <path id="pd"   d="M0,-63 L10,-70 0,-78 L-10,-70 Z"/>
      </defs>

      <!-- ── Outer rings ── -->
      <circle r="310" fill="none" stroke="url(#gLine)" stroke-width="3"/>
      <circle r="306" fill="none" stroke="#8B6914"     stroke-width=".7"/>
      <circle r="303" fill="none" stroke="url(#gLine)" stroke-width=".5"/>
      <circle r="300" fill="none" stroke="#C5A028"     stroke-width=".4" stroke-dasharray="3 5"/>

      <!-- ── Sunburst (32+32) slow-spin ── -->
      <g class="ring-spin" fill="url(#gPetal)" stroke="#7A5C10" stroke-width=".5">
        <use href="#pSB"/><use href="#pSB" transform="rotate(11.25)"/><use href="#pSB" transform="rotate(22.5)"/>
        <use href="#pSB" transform="rotate(33.75)"/><use href="#pSB" transform="rotate(45)"/><use href="#pSB" transform="rotate(56.25)"/>
        <use href="#pSB" transform="rotate(67.5)"/><use href="#pSB" transform="rotate(78.75)"/><use href="#pSB" transform="rotate(90)"/>
        <use href="#pSB" transform="rotate(101.25)"/><use href="#pSB" transform="rotate(112.5)"/><use href="#pSB" transform="rotate(123.75)"/>
        <use href="#pSB" transform="rotate(135)"/><use href="#pSB" transform="rotate(146.25)"/><use href="#pSB" transform="rotate(157.5)"/>
        <use href="#pSB" transform="rotate(168.75)"/><use href="#pSB" transform="rotate(180)"/><use href="#pSB" transform="rotate(191.25)"/>
        <use href="#pSB" transform="rotate(202.5)"/><use href="#pSB" transform="rotate(213.75)"/><use href="#pSB" transform="rotate(225)"/>
        <use href="#pSB" transform="rotate(236.25)"/><use href="#pSB" transform="rotate(247.5)"/><use href="#pSB" transform="rotate(258.75)"/>
        <use href="#pSB" transform="rotate(270)"/><use href="#pSB" transform="rotate(281.25)"/><use href="#pSB" transform="rotate(292.5)"/>
        <use href="#pSB" transform="rotate(303.75)"/><use href="#pSB" transform="rotate(315)"/><use href="#pSB" transform="rotate(326.25)"/>
        <use href="#pSB" transform="rotate(337.5)"/><use href="#pSB" transform="rotate(348.75)"/>
        <use href="#pSBS" transform="rotate(5.625)"/><use href="#pSBS" transform="rotate(16.875)"/><use href="#pSBS" transform="rotate(28.125)"/>
        <use href="#pSBS" transform="rotate(39.375)"/><use href="#pSBS" transform="rotate(50.625)"/><use href="#pSBS" transform="rotate(61.875)"/>
        <use href="#pSBS" transform="rotate(73.125)"/><use href="#pSBS" transform="rotate(84.375)"/><use href="#pSBS" transform="rotate(95.625)"/>
        <use href="#pSBS" transform="rotate(106.875)"/><use href="#pSBS" transform="rotate(118.125)"/><use href="#pSBS" transform="rotate(129.375)"/>
        <use href="#pSBS" transform="rotate(140.625)"/><use href="#pSBS" transform="rotate(151.875)"/><use href="#pSBS" transform="rotate(163.125)"/>
        <use href="#pSBS" transform="rotate(174.375)"/><use href="#pSBS" transform="rotate(185.625)"/><use href="#pSBS" transform="rotate(196.875)"/>
        <use href="#pSBS" transform="rotate(208.125)"/><use href="#pSBS" transform="rotate(219.375)"/><use href="#pSBS" transform="rotate(230.625)"/>
        <use href="#pSBS" transform="rotate(241.875)"/><use href="#pSBS" transform="rotate(253.125)"/><use href="#pSBS" transform="rotate(264.375)"/>
        <use href="#pSBS" transform="rotate(275.625)"/><use href="#pSBS" transform="rotate(286.875)"/><use href="#pSBS" transform="rotate(298.125)"/>
        <use href="#pSBS" transform="rotate(309.375)"/><use href="#pSBS" transform="rotate(320.625)"/><use href="#pSBS" transform="rotate(331.875)"/>
        <use href="#pSBS" transform="rotate(343.125)"/><use href="#pSBS" transform="rotate(354.375)"/>
      </g>

      <!-- Shimmer arc A — sweeps across outer ring -->
      <circle r="260" class="shimmer-a" fill="none" stroke="rgba(255,228,77,.22)" stroke-width="10"
              stroke-dasharray="22 1612" stroke-linecap="round"/>

      <circle r="230" fill="none" stroke="url(#gLine)" stroke-width="2.5"/>
      <circle r="226" fill="none" stroke="#8B6914"     stroke-width=".6"/>
      <circle r="222" fill="none" stroke="#D4AF37"     stroke-width=".4" stroke-dasharray="5 4.3"/>

      <!-- ── Geometric band: 24 diamonds r=200–220 ── -->
      <circle r="220" fill="none" stroke="url(#gLine)" stroke-width="1.5"/>
      <circle r="200" fill="none" stroke="url(#gLine)" stroke-width="1.5"/>
      <circle r="210" fill="none" stroke="#C5A028"     stroke-width=".6" stroke-dasharray="4 3.8"/>
      <g fill="url(#gPetal)" stroke="#7A5C10" stroke-width=".4">

        <path d="M0,-200 L8,-210 0,-220 L-8,-210 Z" transform="rotate(195)"/>
        <path d="M0,-200 L8,-210 0,-220 L-8,-210 Z" transform="rotate(210)"/>
        <path d="M0,-200 L8,-210 0,-220 L-8,-210 Z" transform="rotate(225)"/>
        <path d="M0,-200 L8,-210 0,-220 L-8,-210 Z" transform="rotate(240)"/>
        <path d="M0,-200 L8,-210 0,-220 L-8,-210 Z" transform="rotate(255)"/>
        <path d="M0,-200 L8,-210 0,-220 L-8,-210 Z" transform="rotate(270)"/>
        <path d="M0,-200 L8,-210 0,-220 L-8,-210 Z" transform="rotate(285)"/>
        <path d="M0,-200 L8,-210 0,-220 L-8,-210 Z" transform="rotate(300)"/>
        <path d="M0,-200 L8,-210 0,-220 L-8,-210 Z" transform="rotate(315)"/>
        <path d="M0,-200 L8,-210 0,-220 L-8,-210 Z" transform="rotate(330)"/>
        <path d="M0,-200 L8,-210 0,-220 L-8,-210 Z" transform="rotate(345)"/>
      </g>

      <!-- ── 16-petal lotus + 16 leaves, counter-rotation ── -->
      <circle r="198" fill="none" stroke="url(#gLine)" stroke-width="2"/>
      <circle r="194" fill="none" stroke="#8B6914"     stroke-width=".5"/>
      <g class="ring-spin-rev" fill="url(#gPetal)" stroke="#7A5C10" stroke-width=".55">
        <use href="#pM"/><use href="#pM" transform="rotate(22.5)"/><use href="#pM" transform="rotate(45)"/>

        <use href="#pM" transform="rotate(135)"/><use href="#pM" transform="rotate(157.5)"/><use href="#pM" transform="rotate(180)"/>
        <use href="#pM" transform="rotate(202.5)"/><use href="#pM" transform="rotate(225)"/><use href="#pM" transform="rotate(247.5)"/>
        <use href="#pM" transform="rotate(270)"/><use href="#pM" transform="rotate(292.5)"/><use href="#pM" transform="rotate(315)"/>
        <use href="#pM" transform="rotate(337.5)"/>
        <use href="#pML" transform="rotate(11.25)"/><use href="#pML" transform="rotate(33.75)"/><use href="#pML" transform="rotate(56.25)"/>
        <use href="#pML" transform="rotate(78.75)"/><use href="#pML" transform="rotate(101.25)"/><use href="#pML" transform="rotate(123.75)"/>
        <use href="#pML" transform="rotate(146.25)"/><use href="#pML" transform="rotate(168.75)"/><use href="#pML" transform="rotate(191.25)"/>
        <use href="#pML" transform="rotate(213.75)"/><use href="#pML" transform="rotate(236.25)"/><use href="#pML" transform="rotate(258.75)"/>
        <use href="#pML" transform="rotate(281.25)"/><use href="#pML" transform="rotate(303.75)"/><use href="#pML" transform="rotate(326.25)"/>
        <use href="#pML" transform="rotate(348.75)"/>
      </g>

      <!-- Shimmer arc B — mid ring -->
      <circle r="175" class="shimmer-b" fill="none" stroke="rgba(255,228,77,.18)" stroke-width="8"
              stroke-dasharray="18 1081" stroke-linecap="round"/>

      <circle r="152" fill="none" stroke="url(#gLine)" stroke-width="2"/>
      <circle r="148" fill="none" stroke="#8B6914"     stroke-width=".5"/>

      <!-- ── Filigree band r=134–146 ── -->
      <circle r="146" fill="none" stroke="url(#gLine)" stroke-width="1.4"/>
      <circle r="134" fill="none" stroke="url(#gLine)" stroke-width="1.4"/>
      <circle r="140" fill="none" stroke="#D4AF37"     stroke-width=".8" stroke-dasharray="3 4.4"/>
      <circle r="142" fill="none" stroke="#C5A028"     stroke-width=".5" stroke-dasharray="1.5 6.9"/>
      <g fill="#FFD700">
        <circle cx="0" cy="-140" r="3.2"/><circle cx="0" cy="-140" r="3.2" transform="rotate(11.25)"/>
        <circle cx="0" cy="-140" r="3.2" transform="rotate(22.5)"/><circle cx="0" cy="-140" r="3.2" transform="rotate(33.75)"/>

        <circle cx="0" cy="-140" r="3.2" transform="rotate(67.5)"/><circle cx="0" cy="-140" r="3.2" transform="rotate(78.75)"/>
        <circle cx="0" cy="-140" r="3.2" transform="rotate(90)"/><circle cx="0" cy="-140" r="3.2" transform="rotate(101.25)"/>
        <circle cx="0" cy="-140" r="3.2" transform="rotate(112.5)"/><circle cx="0" cy="-140" r="3.2" transform="rotate(123.75)"/>
        <circle cx="0" cy="-140" r="3.2" transform="rotate(135)"/><circle cx="0" cy="-140" r="3.2" transform="rotate(146.25)"/>
        <circle cx="0" cy="-140" r="3.2" transform="rotate(157.5)"/><circle cx="0" cy="-140" r="3.2" transform="rotate(168.75)"/>
        <circle cx="0" cy="-140" r="3.2" transform="rotate(180)"/><circle cx="0" cy="-140" r="3.2" transform="rotate(191.25)"/>
        <circle cx="0" cy="-140" r="3.2" transform="rotate(202.5)"/><circle cx="0" cy="-140" r="3.2" transform="rotate(213.75)"/>
        <circle cx="0" cy="-140" r="3.2" transform="rotate(225)"/><circle cx="0" cy="-140" r="3.2" transform="rotate(236.25)"/>
        <circle cx="0" cy="-140" r="3.2" transform="rotate(247.5)"/><circle cx="0" cy="-140" r="3.2" transform="rotate(258.75)"/>

        <circle cx="0" cy="-140" r="3.2" transform="rotate(337.5)"/><circle cx="0" cy="-140" r="3.2" transform="rotate(348.75)"/>
      </g>
      <g fill="#C5A028">
        <circle cx="0" cy="-140" r="1.8" transform="rotate(5.625)"/><circle cx="0" cy="-140" r="1.8" transform="rotate(16.875)"/>
        <circle cx="0" cy="-140" r="1.8" transform="rotate(28.125)"/><circle cx="0" cy="-140" r="1.8" transform="rotate(39.375)"/>
        <circle cx="0" cy="-140" r="1.8" transform="rotate(50.625)"/><circle cx="0" cy="-140" r="1.8" transform="rotate(61.875)"/>
        <circle cx="0" cy="-140" r="1.8" transform="rotate(73.125)"/><circle cx="0" cy="-140" r="1.8" transform="rotate(84.375)"/>
        <circle cx="0" cy="-140" r="1.8" transform="rotate(95.625)"/><circle cx="0" cy="-140" r="1.8" transform="rotate(106.875)"/>
