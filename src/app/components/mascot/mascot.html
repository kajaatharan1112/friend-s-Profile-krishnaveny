@if (visible) {
  <div class="mascot-wrap" [class.minimized]="minimized" [class.fan-open]="fanOpen">

    <!-- Dismiss button -->
    <button class="mascot-dismiss" (click)="dismiss()" aria-label="Dismiss mascot">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6"  x2="6"  y2="18"/>
        <line x1="6"  y1="6"  x2="18" y2="18"/>
      </svg>
    </button>

    <!-- Peacock SVG -->
    <div class="peacock" (click)="toggle()" role="button" tabindex="0"
         aria-label="Toggle mascot" (keydown.enter)="toggle()">

      <!-- Tail fan feathers (behind body) -->
      <svg class="peacock-tail" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
        <g>
          <!-- Centre feather -->
          <ellipse cx="80" cy="50" rx="7" ry="42"  fill="#005F4E" opacity="0.85"/>
          <ellipse cx="80" cy="22" rx="5" ry="10"  fill="#1A237E" opacity="0.90"/>
          <ellipse cx="80" cy="22" rx="3" ry="6"   fill="#006064" opacity="0.90"/>
          <circle  cx="80" cy="18" r="2.5" fill="#C8A84B" opacity="0.95"/>

          <!-- Feather right 1 -->
          <ellipse cx="80" cy="50" rx="6" ry="40"  fill="#005F4E" opacity="0.72" transform="rotate(15 80 108)"/>
          <ellipse cx="80" cy="22" rx="4" ry="9"   fill="#1A237E" opacity="0.82" transform="rotate(15 80 108)"/>
          <circle  cx="90" cy="13" r="2.2" fill="#C8A84B" opacity="0.88"/>

          <!-- Feather left 1 -->
          <ellipse cx="80" cy="50" rx="6" ry="40"  fill="#005F4E" opacity="0.72" transform="rotate(-15 80 108)"/>
          <ellipse cx="80" cy="22" rx="4" ry="9"   fill="#1A237E" opacity="0.82" transform="rotate(-15 80 108)"/>
          <circle  cx="70" cy="13" r="2.2" fill="#C8A84B" opacity="0.88"/>

          <!-- Feather right 2 -->
          <ellipse cx="80" cy="50" rx="5.5" ry="36" fill="#005F4E" opacity="0.60" transform="rotate(30 80 108)"/>
          <circle  cx="101" cy="17" r="2.0" fill="#C8A84B" opacity="0.82"/>

          <!-- Feather left 2 -->
          <ellipse cx="80" cy="50" rx="5.5" ry="36" fill="#005F4E" opacity="0.60" transform="rotate(-30 80 108)"/>
          <circle  cx="59" cy="17" r="2.0" fill="#C8A84B" opacity="0.82"/>

          <!-- Feather right 3 -->
          <ellipse cx="80" cy="50" rx="5" ry="30"  fill="#005F4E" opacity="0.45" transform="rotate(45 80 108)"/>
          <circle  cx="113" cy="26" r="1.8" fill="#C8A84B" opacity="0.72"/>

          <!-- Feather left 3 -->
          <ellipse cx="80" cy="50" rx="5" ry="30"  fill="#005F4E" opacity="0.45" transform="rotate(-45 80 108)"/>
          <circle  cx="47" cy="26" r="1.8" fill="#C8A84B" opacity="0.72"/>
        </g>
      </svg>

      <!-- Body -->
      <svg class="peacock-body" viewBox="0 0 80 102" xmlns="http://www.w3.org/2000/svg">
        <!-- Body oval -->
        <ellipse cx="40" cy="70" rx="22" ry="28" fill="#1B5E20"/>
        <ellipse cx="40" cy="70" rx="14" ry="20" fill="#2E7D32" opacity="0.55"/>

        <!-- Neck -->
        <ellipse cx="40" cy="46" rx="11" ry="20" fill="#006064"/>
        <ellipse cx="40" cy="46" rx="7"  ry="13" fill="#00838F" opacity="0.50"/>

        <!-- Head -->
        <circle cx="40" cy="28" r="13" fill="#005F4E"/>
        <circle cx="40" cy="28" r="9"  fill="#006B5B" opacity="0.55"/>

        <!-- Eye white -->
        <circle cx="36" cy="26" r="4"   fill="#fff"/>
        <!-- Iris -->
        <circle cx="37" cy="26" r="2.5" fill="#1A237E"/>
        <!-- Pupil highlight -->
        <circle cx="38" cy="25" r="0.9" fill="#fff"/>

        <!-- Beak -->
        <ellipse cx="44.5" cy="30" rx="5" ry="2.8"
                 fill="#C8A84B" transform="rotate(18 44.5 30)"/>

        <!-- Crown feather stems -->
        <line x1="38" y1="15" x2="35" y2="6"  stroke="#C8A84B" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="40" y1="14" x2="40" y2="4"  stroke="#C8A84B" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="42" y1="15" x2="45" y2="6"  stroke="#C8A84B" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Crown dots -->
        <circle cx="35" cy="6"  r="2.0" fill="#C8A84B"/>
        <circle cx="40" cy="4"  r="2.3" fill="#C8A84B"/>
        <circle cx="45" cy="6"  r="2.0" fill="#C8A84B"/>
        <!-- Crown inner dot accents -->
        <circle cx="35" cy="6"  r="0.9" fill="#1A237E"/>
        <circle cx="40" cy="4"  r="1.0" fill="#1A237E"/>
        <circle cx="45" cy="6"  r="0.9" fill="#1A237E"/>

        <!-- Feet -->
        <line x1="34" y1="94" x2="30" y2="102" stroke="#1B5E20" stroke-width="2" stroke-linecap="round"/>
        <line x1="34" y1="102" x2="26" y2="102" stroke="#1B5E20" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="46" y1="94" x2="50" y2="102" stroke="#1B5E20" stroke-width="2" stroke-linecap="round"/>
        <line x1="50" y1="102" x2="58" y2="102" stroke="#1B5E20" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Tooltip -->
    <div class="mascot-tip" [class.hidden]="minimized">
      <span>Namaste! I'm Priya 🦚</span>
    </div>

  </div>
}
