<div class="reveal" style="text-align:center; position:relative; z-index:1">
  <h2 class="section-title">Technical Skills</h2>
  <div class="section-title-bar"></div>
</div>

<div class="skills-grid" style="position:relative; z-index:1">
  @for (skill of skills; track skill.name; let i = $index) {
    <div class="skill-card glass-card reveal"
         [style.transition-delay]="(i * 80) + 'ms'">
      <div class="skill-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path [attr.d]="getIcon(skill.icon)"/>
        </svg>
      </div>

      <div class="skill-ring">
        <svg width="96" height="96" viewBox="0 0 96 96">
          <circle class="ring-track" cx="48" cy="48" r="36" fill="none" stroke-width="6"/>
          <circle class="ring-fill" cx="48" cy="48" r="36" fill="none" stroke-width="6"
                  stroke-linecap="round"
                  [attr.stroke-dasharray]="getCircle(skill.pct).dash"
                  [attr.stroke-dashoffset]="getCircle(skill.pct).offset"
                  style="transform:rotate(-90deg);transform-origin:center"/>
          <text class="ring-text" x="48" y="53" text-anchor="middle"
                font-family="'JetBrains Mono',monospace"
                font-size="14" font-weight="400">{{ skill.pct }}%</text>
        </svg>
      </div>

      <h3 class="skill-name">{{ skill.name }}</h3>

      <div class="skill-bar-wrap">
        <div class="skill-bar" [style.width.%]="skill.pct"></div>
      </div>
    </div>
  }
</div>
