<nav [class.scrolled]="scrolled">
  <a class="logo" (click)="scrollTo('#hero')">KS</a>

  <ul class="nav-links">
    @for (link of links; track link.label) {
      <li><a (click)="scrollTo(link.href)">{{ link.label }}</a></li>
    }
  </ul>

  <!-- Right-side controls -->
  <div class="nav-controls">
    <button
      class="palette-toggle"
      (click)="cyclePalette()"
      [attr.aria-label]="'Switch color palette (current: ' + currentPalette + ')'"
      title="Switch color palette">
      <span class="palette-dot palette-dot-1"></span>
      <span class="palette-dot palette-dot-2"></span>
      <span class="palette-dot palette-dot-3"></span>
    </button>

    <!-- Dark mode toggle -->
    <button class="theme-toggle" (click)="toggleDark()" [attr.aria-label]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (darkMode) {
        <!-- Sun icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22"   x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1"  y1="12" x2="3"  y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78"  x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
        </svg>
      } @else {
        <!-- Moon icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>

    <!-- Hamburger (mobile) -->
    <button class="hamburger" (click)="menuOpen = !menuOpen" [class.open]="menuOpen" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- Mobile panel menu -->
  <div class="mobile-menu" [class.open]="menuOpen">
    <div class="mm-inner">
      @for (link of links; track link.label) {
        <a class="mm-link" (click)="scrollTo(link.href)">
          <span class="mm-text">{{ link.label }}</span>
        </a>
      }
    </div>
  </div>
</nav>
