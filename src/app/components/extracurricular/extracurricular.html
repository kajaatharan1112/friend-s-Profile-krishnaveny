<div class="reveal" style="text-align:center">
  <h2 class="section-title">Activities</h2>
  <div class="section-title-bar"></div>
</div>

<div class="extra-grid">
  @for (card of cards; track card.title; let i = $index) {
    <div
      class="extra-card glass-card reveal"
      [style.transition-delay]="(i * 100) + 'ms'"
    >
      <div class="extra-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round">
          <path [attr.d]="getIcon(card.icon)"/>
        </svg>
      </div>
      <h3 class="extra-title">{{ card.title }}</h3>
      <p class="extra-role">{{ card.role }}</p>
      <p class="extra-desc">{{ card.desc }}</p>
    </div>
  }
</div>
